name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FLOWFORGE_DB_PASSWORD: flowforge_test

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: flowforge
          POSTGRES_USER: flowforge_user
          POSTGRES_PASSWORD: flowforge_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U flowforge_user -d flowforge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test